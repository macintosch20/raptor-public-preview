{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Raptor{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'miniapp/freelancer.css' %}">
  <link rel="stylesheet" href="{% static 'miniapp/desktop.css' %}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  {% include "miniapp/includes/theme.html" %}
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Presentation-only shell for the partial source preview. -->
  <main>{% block content %}{% endblock %}</main>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
